name: CD

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AZURE_WEBAPP_NAME: thyme-bot
  AZURE_FUNCTIONAPP_NAME: thyme-bot-func
  NODE_VERSION: "20.x"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run CI checks
        run: npm run ci

      - name: Build application
        run: npm run build

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cp -r dist deploy/
          cp package.json package-lock.json web.config deploy/
          cd deploy && npm ci --omit=dev

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-build
          path: deploy/
          retention-days: 1

  build-functions:
    name: Build Azure Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install main dependencies (for shared code)
        run: npm ci

      - name: Install function dependencies
        working-directory: functions
        run: npm install

      - name: Build functions
        working-directory: functions
        run: npm run build

      - name: Prepare functions deployment
        run: |
          mkdir -p functions-deploy/dailyReminder
          # Copy compiled JS to function folder (alongside function.json)
          cp functions/dist/dailyReminder/*.js functions-deploy/dailyReminder/
          cp functions/dist/dailyReminder/*.js.map functions-deploy/dailyReminder/ 2>/dev/null || true
          # Copy function.json
          cp functions/dailyReminder/function.json functions-deploy/dailyReminder/
          # Copy host.json and package files
          cp functions/host.json functions-deploy/
          cp functions/package.json functions-deploy/
          # Install production dependencies
          cd functions-deploy && npm install --omit=dev

      - name: Upload functions artifact
        uses: actions/upload-artifact@v4
        with:
          name: functions-build
          path: functions-deploy/
          retention-days: 1

  deploy-dev:
    name: Deploy to Development
    needs: [build, build-functions]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event.inputs.environment == 'dev'
    environment:
      name: development
      url: https://${{ env.AZURE_WEBAPP_NAME }}-dev.azurewebsites.net

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: ./app

      - name: Download functions artifact
        uses: actions/download-artifact@v4
        with:
          name: functions-build
          path: ./functions

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}-dev
          package: ./app

      - name: Deploy Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}-dev
          package: ./functions

  deploy-prod:
    name: Deploy to Production
    needs: [build, build-functions, deploy-dev]
    runs-on: ubuntu-latest
    if: github.event.inputs.environment == 'prod'
    environment:
      name: production
      url: https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-build
          path: ./app

      - name: Download functions artifact
        uses: actions/download-artifact@v4
        with:
          name: functions-build
          path: ./functions

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS_PROD }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./app

      - name: Deploy Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./functions
