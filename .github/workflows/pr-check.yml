name: PR Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Check for TypeScript errors
        run: npm run typecheck

      - name: Check code style
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm run test:coverage

      - name: Build check
        run: npm run build

      - name: Check for large files
        run: |
          find . -type f -size +1M -not -path "./.git/*" -not -path "./node_modules/*" | head -10 > large_files.txt
          if [ -s large_files.txt ]; then
            echo "Warning: Large files detected:"
            cat large_files.txt
          fi

      - name: Validate package.json
        run: |
          node -e "
            const pkg = require('./package.json');
            if (!pkg.name) throw new Error('package.json missing name');
            if (!pkg.version) throw new Error('package.json missing version');
            console.log('package.json validation passed');
          "

  label-pr:
    name: Label PR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Label PR based on files changed
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
        continue-on-error: true
